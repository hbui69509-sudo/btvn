<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra Email</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Đăng ký</h2>
        <form id="myForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Nhập email của bạn..." autocomplete="off" />
                <!-- Thẻ div để hiển thị lỗi -->
                <div id="email-error" class="error-text"></div>
            </div>
            <button type="submit">Gửi thông tin</button>
        </form>
    </div>

    <!-- Nhúng file JavaScript ở cuối body -->
    <script src="script.js"></script>
</body>
</html>
